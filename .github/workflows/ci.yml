name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The export/highlight tests only use the standard library, so the heavy
      # Whisper and pyannote dependencies are not installed here.
      - name: Run tests
        run: python -m unittest test_app -v
